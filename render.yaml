# Render Blueprint: New > Blueprint > pick this repo. Add the key values in the Render dashboard.
databases:
  - name: barcode-db
    plan: free
    databaseName: bi
services:
  - type: web
    name: barcode-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - {key: DATABASE_URL, fromDatabase: {name: barcode-db, property: connectionString}}
      - {key: GOOGLE_API_KEY, sync: false}
      - {key: GOOGLE_CSE_ID, sync: false}
      - {key: SERPAPI_KEY, sync: false}
      - {key: UPCITEMDB_KEY, sync: false}
