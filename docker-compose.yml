services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: bi, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: bi}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U bi"], interval: 5s, retries: 10}
  app:
    build: .
    env_file: .env
    environment: {DATABASE_URL: "postgresql+psycopg2://bi:${POSTGRES_PASSWORD}@db:5432/bi"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
